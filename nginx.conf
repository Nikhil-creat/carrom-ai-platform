# Edge proxy: TLS termination, WebSocket upgrade, static SPA, API.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream backend_api { server backend:8000; keepalive 16; }
upstream frontend_app { server frontend:80; }

server {
  listen 80;
  server_name _;
  # Serve over plain HTTP too for local development; set HTTPS_ONLY=1 behaviour by replacing this
  # block's locations with:  return 301 https://$host$request_uri;
  include /etc/nginx/conf.d/locations.inc;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /etc/nginx/conf.d/locations.inc;
}
